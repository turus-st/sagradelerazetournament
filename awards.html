<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awards</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
    <div id="siteHeader"></div>
    <main class="wrap">
        <section class="card"><h1>🏆 Team Awards</h1></section>
        <div id="finalStandingsContainer"></div>
    </main>
    <main class="wrap">
        <section class="card"><h1>🏅 Individual Awards</h1></section>
        <section class="card"><h2>Pitching</h2><div id="p" class="table"></div></section>
        <section class="card"><h2>Batting</h2><div id="b" class="table"></div></section>
        <section class="card"><h2>MVPs</h2><div id="m"></div></section>
    </main>
    <div id="siteFooter"></div>
<script src="assets/common.js"></script><script src="assets/layout.js"></script>
<script>loadData().then(({schedule,results})=>{let P={},B={},M=[];schedule.forEach(g=>{let r=gd(g,results);
r.pitchers.forEach(x=>{let k=g.category+'|'+x.team+'|'+x.name;P[k]??={category:g.category,...x,games:0,rl:0,runsAllowed:0,pgl:0};P[k].games++;P[k].rl+=+x.rl||0;P[k].runsAllowed+=+x.runsAllowed||0;P[k].pgl+=+x.pgl||0});
r.batters.forEach(x=>{let k=g.category+'|'+x.team+'|'+x.name;B[k]??={category:g.category,...x,games:0,h:0,tb:0,ab:0,rbi:0};B[k].games++;['h','tb','ab','rbi'].forEach(f=>B[k][f]+=+x[f]||0)});
if(r.mvp?.name)M.push({category:g.category,game:g.game,...r.mvp})});
p.innerHTML=`<table><tr><th>Cat.</th><th>Name</th><th>Team</th><th>IP</th><th>ER</th><th>ERA</th></tr>${Object.values(P).map(x=>`<tr><td>${x.category}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.rl}</td><td>${x.pgl}</td><td>${pct(x.pgl)}</td></tr>`).join('')}</table>`;
b.innerHTML=`<table><tr><th>Cat.</th><th>Name</th><th>Team</th><th>AB</th><th>H</th><th>TB</th><th>AVG</th><th>SLG</th></tr>${Object.values(B).map(x=>`<tr><td>${x.category}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.ab}</td><td>${x.h}</td><td>${x.tb}</td><td>${pct(x.tb)}</td><td>${pct(x.tb)}</td></tr>`).join('')}</table>`;
m.innerHTML=`<table><tr><th>Cat.</th><th>Name</th><th>Team</th><th>Notes</th></tr>${Object.values(M).map(x=>`<tr><td>${x.category}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${esc(x.notes||'')}</td></tr>`).join('')}</table>`;});
</script>
<script>loadData().then(
    ({
        schedule,
        results,
        config
    }) => {
        const categories = [
            'U10',
            'U12',
            'U15',
            'U18'
        ];
        const medals = {
            1: '🏆 Champion',
            2: '🥈 2nd',
            3: '🥉 3rd'
        };
        document.getElementById('finalStandingsContainer').innerHTML =
            categories.map(cat => {
                const ranking =
                    finalStandings(
                        cat,
                        schedule,
                        results,
                        config
                    );
                return `
                <section class="card">
                    <h2>${cat} - Final Standing</h2>
                    <table>
                        <thead>
                            <tr>
                                <th class="col-num">Pos.</th>
                                <th class="col-team">Team</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${
                                ranking.map(
                                    (
                                        team,
                                        index
                                    ) => `
                                    <tr>
                                        <td class="rank"><b>
                                            ${
                                                medals[
                                                    index+1
                                                ]
                                                ||
                                                (
                                                    index+1
                                                ) + 'th'
                                            }
                                        </b></td>
                                        <td><b>
                                            ${
                                                team
                                                    ||
                                                ''
                                            }
                                        </b></td>
                                    </tr>
                                `
                                ).join('')
                            }
                        </tbody>
                    </table>
                </section>
                `;
            }).join('');
    }
);
</script>
</body></html>
