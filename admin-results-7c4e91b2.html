<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">International Youth Tournament 2026</a><nav><a href="u10.html">U10</a><a href="u12.html">U12</a><a href="u15.html">U15</a><a href="u18.html">U18</a><a href="live.html">Live</a><a href="standings.html">Standings</a><a href="stats.html">Stats</a></nav></div></header><main class="wrap"><section class="card"><h1>Repository connection</h1><div class="formgrid"><label class="wide">Owner<input id="repoOwner"></label><label class="wide">Repository<input id="repoName"></label><label>Branch<input id="repoBranch" value="main"></label><label class="full">Token<input id="repoToken" type="password"></label></div><p><button type="button" class="btn" id="connectButton">Connect and load</button> <button type="button" class="btn alt" id="exportButton">Export JSON</button></p><p id="adminMessage" class="notice hidden"></p></section><section id="adminEditor" class="hidden"><section class="card toolbar"><label>Game<select id="gameSelector"></select></label><button type="button" class="btn" id="publishButton">Publish to GitHub</button></section><section class="card"><h2 id="gameHeading"></h2><div class="formgrid"><label class="wide">Status<select id="gameStatus"><option value="scheduled">Scheduled</option><option value="live">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label>Score 1<input id="gameScore1" type="number" min="0"></label><label>Score 2<input id="gameScore2" type="number" min="0"></label></div></section><section class="card"><h2>TQB values</h2><div id="tqbFields" class="formgrid"></div></section><section class="card"><div class="toolbar"><h2>Pitchers</h2><button type="button" class="btn alt" id="addPitcherButton">Add pitcher</button></div><div id="pitcherRows"></div></section><section class="card"><div class="toolbar"><h2>Batters</h2><button type="button" class="btn alt" id="addBatterButton">Add batter</button></div><div id="batterRows"></div></section><section class="card"><h2>MVP</h2><div class="formgrid"><label class="wide">Name<input id="mvpName"></label><label class="wide">Team<input id="mvpTeam"></label><label class="full">Notes<textarea id="mvpNotes"></textarea></label></div></section><button type="button" class="btn" id="saveGameButton">Save game in working copy</button></section></main><footer>International Youth Tournament 2026</footer><script src="assets/common.js"></script><script src="assets/admin.js"></script></body></html>
