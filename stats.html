<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">International Youth Tournament 2026</a><nav><a href="u10.html">U10</a><a href="u12.html">U12</a><a href="u15.html">U15</a><a href="u18.html">U18</a><a href="live.html">Live</a><a href="standings.html">Standings</a><a href="stats.html" class="on">Stats</a></nav></div></header><main class="wrap"><section class="card"><h1>Player statistics</h1></section><section class="card"><h2>Pitching</h2><div id="p" class="table"></div></section><section class="card"><h2>Batting</h2><div id="b" class="table"></div></section><section class="card"><h2>Match MVPs</h2><div id="m"></div></section></main><footer>International Youth Tournament 2026</footer><script src="assets/common.js"></script><script>loadData().then(({schedule,results})=>{let P={},B={},M=[];schedule.forEach(g=>{let r=gd(g,results);r.pitchers.forEach(x=>{let k=g.category+'|'+x.team+'|'+x.name;P[k]??={category:g.category,...x,games:0,rl:0,runsAllowed:0,pgl:0};P[k].games++;P[k].rl+=+x.rl||0;P[k].runsAllowed+=+x.runsAllowed||0;P[k].pgl+=+x.pgl||0});r.batters.forEach(x=>{let k=g.category+'|'+x.team+'|'+x.name;B[k]??={category:g.category,...x,games:0,h:0,tb:0,ab:0,rbi:0};B[k].games++;['h','tb','ab','rbi'].forEach(f=>B[k][f]+=+x[f]||0)});if(r.mvp?.name)M.push({category:g.category,game:g.game,...r.mvp})});p.innerHTML=`<table><tr><th>Cat.</th><th>Name</th><th>Team</th><th>G</th><th>IP</th><th>RA</th><th>PGL</th></tr>${Object.values(P).map(x=>`<tr><td>${x.category}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.games}</td><td>${x.rl}</td><td>${x.runsAllowed}</td><td>${x.pgl}</td></tr>`).join('')}</table>`;b.innerHTML=`<table><tr><th>Cat.</th><th>Name</th><th>Team</th><th>G</th><th>AB</th><th>H</th><th>TB</th><th>RBI</th></tr>${Object.values(B).map(x=>`<tr><td>${x.category}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.games}</td><td>${x.ab}</td><td>${x.h}</td><td>${x.tb}</td><td>${x.rbi}</td></tr>`).join('')}</table>`;m.innerHTML=M.length?M.map(x=>`<p><b>${x.category} #${x.game}: ${esc(x.name)}</b> - ${esc(x.team)}<br>${esc(x.notes)}</p>`).join(''):'<p>No MVPs published.</p>'})</script></body></html>
