<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U10</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">International Youth Tournament 2026</a><nav><a href="u10.html" class="on">U10</a><a href="u12.html">U12</a><a href="u15.html">U15</a><a href="u18.html">U18</a><a href="live.html">Live</a><a href="standings.html">Standings</a><a href="stats.html">Stats</a></nav></div></header><main class="wrap"><script>document.body.dataset.cat="U10"</script><section class="card"><h1>U10 schedule & results</h1></section><div id="content"></div></main><footer>International Youth Tournament 2026</footer><script src="assets/common.js"></script><script>loadData().then(({schedule,results,config})=>{schedule=effective(schedule,results,config);const cat=document.body.dataset.cat,games=schedule.filter(g=>g.category===cat),days=[...new Set(games.map(g=>g.date))];content.innerHTML=days.map(d=>`<section class="card"><h2>${new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><div class="table"><table><thead><tr><th>Game</th><th>Time</th><th>Field</th><th>Match-up</th><th>Score</th><th>Status</th></tr></thead><tbody>${games.filter(g=>g.date===d).map(g=>{const r=gd(g,results);return `<tr><td>${g.game}</td><td>${g.time}</td><td>${esc(g.field)}</td><td><b>${esc(g.team1)}</b><span class="muted"> vs </span><b>${esc(g.team2)}</b><br>${esc(g.phase)} ${esc(g.group)}</td><td class="score">${r.score1??'-'} : ${r.score2??'-'}</td><td>${badge(r.status)}</td></tr>`}).join('')}</tbody></table></div></section>`).join('')}).catch(e=>content.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></body></html>
