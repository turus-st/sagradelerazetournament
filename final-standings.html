<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Final Standings</title>
    assets/style.css
</head>
<body>
<div id="siteHeader"></div>
<main class="wrap">
    <section class="card">
        <h1>Final Standings</h1>
        <div id="finalStandings"></div>
    </section>
</main>
<div id="siteFooter"></div>
assets/common.jsscript>
assets/layout.jsscript>
<script>
loadData().then(
    ({
        schedule,
        results,
        config
    }) => {
        const categories = [
            'U10',
            'U12',
            'U15',
            'U18'
        ];
        const medals = {

            1: '🥇',
            2: '🥈',
            3: '🥉'

        };
        finalStandings.innerHTML =
            categories.map(cat => {
                const ranking =
                    finalStandings(
                        cat,
                        schedule,
                        results
                    );
                return `
                <section class="card">
                    <h2>${cat}</h2>
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th>Pos.</th>
                                <th>Team</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${
                                ranking.map(
                                    (
                                        team,
                                        index
                                    ) => `
                                    <tr>
                                        <td>
                                            ${
                                                medals[
                                                    index+1
                                                ]
                                                ||
                                                (
                                                    index+1
                                                ) + '°'
                                            }
                                        </td>
                                        <td>
                                            ${
                                                team
                                                    ||
                                                ''
                                            }
                                        </td>
                                    </tr>
                                `
                                ).join('')
                            }
                        </tbody>
                    </table>
                </section>
                `;
            }).join('');
    }
);
</script>
</body>
</html>
