<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="siteHeader"></div><main class="wrap"><section class="card"><h1>Standings</h1><p>Order: winning percentage, head-to-head for tied teams, TQB tied teams, TQB entire tournament.</p></section><div id="groups"></div></main><div id="siteFooter"></div><script src="assets/common.js"></script><script src="assets/layout.js"></script><script>loadData().then(({schedule,results,config})=>{const out=[];for(const[cat,cc]of Object.entries(config.categories))for(const grp of Object.keys(cc.groups))out.push(`<section class="card"><h2>${cat} - Group ${grp}</h2><div class="table"><table><thead><tr><th class="col-num">#</th><th class="col-team">Team</th><th class="col-num">G</th><th class="col-num">W</th><th class="col-num">L</th><th class="col-num">T</th><th class="col-num">R</th><th class="col-num">RA</th><th class="col-num">PT</th><th class="col-pct">PCT</th><th class="col-pct">TQB</th></tr></thead><tbody>${table(cat,grp,schedule,results,config).map((s,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(s.team)}</b></td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${s.t}</td><td>${s.rf}</td><td>${s.ra}</td><td>${pct(s.pt)}</td><td>${pct(s.pct)}</td><td>${s.tqb??'-'}</td></tr>`).join('')}</tbody></table></div></section>`);groups.innerHTML=out.join('')}).catch(e=>groups.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></body></html>
