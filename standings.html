<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">International Youth Tournament 2026</a><nav><a href="u10.html">U10</a><a href="u12.html">U12</a><a href="u15.html">U15</a><a href="u18.html">U18</a><a href="live.html">Live</a><a href="standings.html" class="on">Standings</a><a href="stats.html">Stats</a></nav></div></header><main class="wrap"><section class="card"><h1>Standings</h1><p>Order: winning percentage, head-to-head for two tied teams, administrator-entered TQB, run differential, runs scored.</p></section><div id="groups"></div></main><footer>International Youth Tournament 2026</footer><script src="assets/common.js"></script><script>loadData().then(({schedule,results,config})=>{const out=[];for(const[cat,cc]of Object.entries(config.categories))for(const grp of Object.keys(cc.groups))out.push(`<section class="card"><h2>${cat} - Group ${grp}</h2><div class="table"><table><thead><tr><th>#</th><th>Team</th><th>G</th><th>W</th><th>L</th><th>RF</th><th>RA</th><th>Diff</th><th>PCT</th><th>TQB</th></tr></thead><tbody>${table(cat,grp,schedule,results,config).map((s,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(s.team)}</b></td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${s.rf}</td><td>${s.ra}</td><td>${s.diff>0?'+':''}${s.diff}</td><td>${pct(s.pct)}</td><td>${s.tqb??'-'}</td></tr>`).join('')}</tbody></table></div></section>`);groups.innerHTML=out.join('')}).catch(e=>groups.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></body></html>
