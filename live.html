<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><a class="brand" href="index.html">International Youth Tournament 2026</a><nav><a href="u10.html">U10</a><a href="u12.html">U12</a><a href="u15.html">U15</a><a href="u18.html">U18</a><a href="live.html" class="on">Live</a><a href="standings.html">Standings</a><a href="stats.html">Stats</a></nav></div></header><main class="wrap"><section class="card"><h1>Live results</h1><p class="muted">All categories and fields. Refreshes every 15 seconds.</p><div id="live"></div></section></main><footer>International Youth Tournament 2026</footer><script src="assets/common.js"></script><script>async function draw(){try{let{schedule,results,config}=await loadData();schedule=effective(schedule,results,config);const a=schedule.filter(g=>gd(g,results).status==='live');live.innerHTML=a.length?a.map(g=>{const r=gd(g,results);return `<article class="match"><b class="category">${g.category}</b><div><b>${g.time.split('-')[0]}</b><br><small>#${g.game}</small></div><div><div class="teamline"><b>${esc(g.team1)}</b><span class="score">${r.score1??'-'}</span></div><div class="teamline"><b>${esc(g.team2)}</b><span class="score">${r.score2??'-'}</span></div><small class="muted">${esc(g.field)} - ${esc(g.phase)}</small></div>${badge(r.status)}</article>`}).join(''):'<p class="notice">No games are currently in progress.</p>'}catch(e){live.innerHTML=`<p class="notice error">${esc(e.message)}</p>`}}draw();setInterval(draw,15000)</script></body></html>
