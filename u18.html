<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U18</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="siteHeader"></div><main class="wrap"><script>document.body.dataset.cat="U18"</script><section class="card"><h1>U18 schedule & results</h1></section><div id="content"></div><script src="assets/common.js"></script><script src="assets/layout.js"></script><script>loadData().then(({schedule,results,config})=>{schedule=effective(schedule,results,config);const cat=document.body.dataset.cat,games=schedule.filter(g=>g.category===cat),days=[...new Set(games.map(g=>g.date))];content.innerHTML=days.map(d=>`<section class="card"><h2>${new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><div class="table"><table><thead><tr><th class="col-num">Game</th><th class="col-time">Time</th><th class="col-field">Field</th><th class="col-match">Match-up</th><th class="col-score">Score</th><th class="col-status">Status</th></tr></thead><tbody>${games.filter(g=>g.date===d).map(g=>{const r=gd(g,results);return `<tr><td>${g.game}</td><td>${g.time}</td><td>${esc(g.field)}</td><td><b>${esc(g.team1)}</b><span class="muted"> vs </span><b>${esc(g.team2)}</b><br>${esc(g.phase)} ${esc(g.group)}</td><td class="score">${r.score1??'-'} : ${r.score2??'-'}</td><td>${badge(r.status)}</td></tr>`}).join('')}</tbody></table></div></section>`).join('')}).catch(e=>content.innerHTML=`<p class="notice error">${esc(e.message)}</p>`)</script></main><div id="siteFooter"></div></body></html>
